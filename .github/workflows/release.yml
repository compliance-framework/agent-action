name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@dc7434879fbd0db1d1df9f590ed8bc13789bd320 # v1.9.2
    permissions:
      contents: write
      packages: write
    secrets: inherit
