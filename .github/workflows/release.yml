name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@e85d35af2af2ddfcd4b92061d2063e665c1831f6 # v1.7.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
