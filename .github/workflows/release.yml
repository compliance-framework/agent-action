name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    permissions:
      contents: write
      packages: write
    secrets: inherit
