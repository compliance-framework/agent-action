name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A final vX.Y.Z release moves the v<X> tag to the release commit; a release candidate moves nothing.
  release:
    uses: compliance-framework/workflows/.github/workflows/release-action.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    permissions:
      contents: write
      packages: write
    secrets: inherit
