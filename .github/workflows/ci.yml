# Shared action CI from compliance-framework/workflows (hadolint, docker build, actionlint,
# PR title and osv-scanner), pinned to a release commit that ccf-bump moves. The status check
# to require is `ci / required`.
name: ci

on:
  pull_request:
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-action.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
